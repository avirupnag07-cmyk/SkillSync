version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Relational Database Service
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: skillsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillsync_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-skillsync_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillsync} -d ${POSTGRES_DB:-skillsync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillsync-net

  # -------------------------------------------------------------
  # 2. FastAPI Intelligence Backend
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsync-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillsync}:${POSTGRES_PASSWORD:-skillsync_secure_password_2026}@postgres:5432/${POSTGRES_DB:-skillsync_db}
      SECRET_KEY: ${SECRET_KEY:-skillsync-production-jwt-secret-key-32chars}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - skillsync-net

  # -------------------------------------------------------------
  # 3. Next.js High-Craft Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillsync-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - skillsync-net

  # -------------------------------------------------------------
  # 4. Optional Local Ollama Engine Profile
  # -------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: skillsync-ollama
    restart: unless-stopped
    profiles:
      - with-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - skillsync-net

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

networks:
  skillsync-net:
    driver: bridge
